services:
  # 1. Backend API (Rust)
  api:
    build: ./backend
    container_name: monitor_api
    restart: on-failure
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - monitor_net

  # 2. Frontend (Nginx)
  web:
    image: nginx:alpine
    container_name: monitor_web
    ports:
      - "8080:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - monitor_net

networks:
  monitor_net:
    driver: bridge